<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Naithik — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 560px;
      width: 100%;
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      line-height: 1;
      letter-spacing: 2px;
      color: #f0f0f0;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 6px;
      background: #1f1f1f;
      color: #888;
      border: 1px solid #2a2a2a;
      margin-top: 8px;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    hr {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 1.5rem 0;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 0.5rem;
    }

    .stat-card {
      background: #1f1f1f;
      border-radius: 10px;
      padding: 1rem;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #555;
      margin-bottom: 6px;
    }

    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: #f0f0f0;
    }

    .section-title {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555;
      margin-bottom: 12px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #2a2a2a;
      font-size: 13px;
      color: #888;
    }

    .fav-block {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .fav-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      color: #f0f0f0;
      line-height: 1;
    }

    .fav-title {
      font-size: 14px;
      font-weight: 500;
      color: #f0f0f0;
    }

    .fav-sub {
      font-size: 12px;
      color: #555;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">NAITHIK</div>
    <div class="badge">Personal Portfolio · 2026</div>

    <hr />

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Age</div>
        <div class="stat-val">14</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Height</div>
        <div class="stat-val">5'6"</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Weight</div>
        <div class="stat-val">60 kg</div>
      </div>
    </div>

    <hr />

    <div class="section-title">Hobbies</div>
    <div class="pills">
      <span class="pill">coding 💻</span>
    </div>

    <hr />

    <div class="section-title">Favourite thing</div>
    <div class="fav-block">
      <div class="fav-num">❤️</div>
      <div>
        <div class="fav-title">Kindness</div>
        <div class="fav-sub">the realest thing out there</div>
      </div>
    </div>
  </div>
</body>
</html>
